# ---------------------------------------------------------------------------
# Zone system
# Set use_maz: false for TAZ-only models (zone IDs in outputs are already TAZs).
# For 2-zone (MAZ+TAZ) models, specify which columns in final_land_use
# hold the MAZ and TAZ IDs.
# ---------------------------------------------------------------------------
zones:
  use_maz:  true          # false = TAZ-only model, no MAZ→TAZ conversion needed
  maz_col:  [MAZ, zone_id]      # column in final_land_use containing MAZ IDs
  taz_col:  TAZ           # column in final_land_use containing TAZ IDs




# ---------------------------------------------------------------------------
# Column names in the ActivitySim output files
# Change only if your outputs use non-standard column names.
# ---------------------------------------------------------------------------
columns:
  ptype:          ptype           # person type column in persons file
  hhsize:         hhsize          # HH size column in households file
  auto_ownership: auto_ownership  # vehicle count column in households file
  num_workers:    num_workers     # workers per HH in households file
  num_adults:     num_adults      # adults per HH in households file
  # income_segment: [income_segment, income_broad]  # OPTIONAL household income segment/level column for trip enrichment
  tour_type:      primary_purpose # tour type column in tours file
  # tour_purpose: [primary_purpose, tour_type, purpose]
  # sample_rate: sample_rate     # OPTIONAL override; if omitted, code auto-detects
                                 # a households column literally named 'sample_rate'.
                                 # finalweight = 1/sample_rate (unless explicit run weight columns are provided)
  # school_esc_outbound: [school_esc_outbound, out_escort_type]
  # school_esc_inbound: [school_esc_inbound, inb_escort_type]

# OPTIONAL person type display labels used in dropdowns/charts
# Keys should match raw ptype values in outputs
person_types:
  1: Full-time worker
  2: Part-time worker
  3: University student
  4: Non-worker adult
  5: Retired
  6: Driving-age student
  7: Non-driving-age student
  8: Preschool

  transit_subsidy:
    mapping:
      0: No subsidy
      1: Discounted
      2: Free

  # geography:
  #   mapping:
  #     1: County_name1
  #     2: County_name2
  #     3: County_name3

  mode:
    mapping:
      SOV: Drive Alone
      HOV2: Shared Ride 2
      HOV3: Shared Ride 3+
      WALK: Walk
      BIKE: Bike
      EBIKE: E-Bike
      ESCOOTER: E-Scooter
      WALK_TRANSIT: Walk-Transit
      BIKE_TRANSIT: Bike-Transit
      PNR_TRANSIT: PNR-Transit
      KNR_TRANSIT: KNR-Transit
      TAXI: Taxi
      TNC_SINGLE: TNC-Single
      TNC_SHARED: TNC-Pool
      SCHOOLBUS: School Bus


  # escort:
  #   mapping:
  #     not_escorted: No Escort
  #     pure_escort: Pure Escort
  #     ride_share: Ride Share
  #     0: No Escort
  #     1: Pure Escort
  #     2: Ride Share
  #     "": No Escort

  tour_purpose:
    mapping:
      all_tour_purposes: All Tour Purposes
      work: Work
      school: School
      joint: Joint
      escort: Escort
      shopping: Shopping
      othmaint: Other Maintenance
      eatout: Eat Out
      social: Social
      othdiscr: Other Discretionary
      atwork: At-Work
  
  mandatory_tour_frequency:
    mapping:
      work1: Work
      school1: School
      work2: 2 Work
      school2: 2 School
      work_and_school: 1 Work + 1 School

  daily_activity_pattern:
    mapping:
      M : M
      N : N
      H : H

# # OPTIONAL transit subsidy display labels used in charts
# # Keys should match raw transit_pass_subsidy values in the persons table
# transit_subsidies:
#   0: No subsidy
#   1: Discounted
#   2: Free

# OPTIONAL summary-time grouping for outputs with a tour_purpose dimension
# group_joint_tour_purposes: true
# group_atwork_tour_purposes: true
# group_school_tour_purposes: true

# ---------------------------------------------------------------------------
# Geography grouping (OPTIONAL)
# Enables district/county/zone-group level breakdowns.
# Remove this section (or set enabled: false) to disable geographic summaries.
# ---------------------------------------------------------------------------
geography:
  enabled: false
  # aggregations:
  #   school_district:
  #     source_zone_system: maz
  #     file: C:\Users\wesley.darling\Downloads\viz\viz\new_output\land_use.csv
  #     zone_id_col: zone_id
  #     geography_col: DIST_9to12


segmentation:
  enabled: false
  dashboard:
    segmentation_type: signup_platform
    visibility: segments_only   # full_only | segments_only | full_and_segments
  definitions:
    signup_platform:
      include_full: true
      persist_segmented_prepared_tables: false
      allow_overlapping: false
      on_empty_segment: warn
      source:
        type: prepared_column 
        source_table: hh
        column: signup_platform
      segments:
        - id: rmove
          label: RMove
          values: ["rmove"]
        - id: browser
          label: Browser
          values: ["browser"]
        - id: call
          label: Call
          values: ["call"]

    person_sex:
      include_full: false
      persist_segmented_prepared_tables: false
      allow_overlapping: false
      on_empty_segment: warn
      source:
        type: prepared_column
        source_table: per
        column: SEX
      segments:
        - id: male
          label: Male
          values: [1]
        - id: female
          label: Female
          values: [2]

# ---------------------------------------------------------------------------
# Mode display (OPTIONAL)
# order: controls the display order for mode charts.
# groups: rolls up individual modes into aggregate categories for summary charts.
# If omitted, modes appear in the order found in the data with no grouping.
# ---------------------------------------------------------------------------
# modes:
#   order:
