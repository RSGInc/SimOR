# ActivitySim Visualizer Configuration
# Adapt this file for each model deployment.
# Only the sections you need are required — see comments for which are optional.

name: "Default Settings"
dashboard_title: "Metro Cropped Dataset Output Visualizer"

processor:
  root: artifacts/
  weighting_modes: [unweighted, weighted]

visualizer:
  dashboard_pages:
    - overview
    - long_term_choices
    - daily_travel
    - joint_travel
    - tour_summaries
    - trip_summaries
    - validation
    # - skims
    # - raw_trip_demo

  run_colors:
    - "#006FA1" # Marine
    - "#63AF5E" # Leaf
    - "#BA1222"  # Cherry
    - "#524D85" # violet
    - "#FFC20E"  # sunshine
    - "#75BEE9"  # sky
    # - "#ff7f0e"
    # - "#2ca02c"
    # - "#d62728"
    # - "#9467bd"
    # - "#8c564b"
    # - "#e377c2"
    # - "#7f7f7f"

  export_html:
    # enabled: true
    # dashboard:
    #   segmentation_type: signup_platform
    #   segmentation_visibility: segments_only
    # Export segmentation defaults to segmentation.dashboard when omitted.
    # Use full_only, segments_only, or full_and_segments to choose which
    # summary series are baked into one exported HTML file.
  #   # Omit `pages` to mirror `dashboard_pages`.
  #   # Omit selector overrides to export all widget states.
  #   # Uncomment only when you want to narrow the default export:
    dashboard:
      weighting: [unweighted]
    pages:
      long_term_choices:
        mandatory_location_choice:
          parts:
            commuting_flows:
              enabled: false
            
        shadow_pricing:
          # enabled: true
          # geography_level: [all]
          # student_type: [all]
          parts:
            workplace_table:
              enabled: false
            school_table:
              enabled: false
      tour_summaries:
        internal_external_tours:
          enabled: false
      validation:
        traffic:
          enabled: false
        transit:
          enabled: false
        vmt:
          enabled: false

# ---------------------------------------------------------------------------
# ActivitySim output file names
# Use stems (no extension) for automatic format detection: the reader will try
# .parquet first, then .csv.  You may also specify an explicit extension to
# force a particular format (e.g. final_households.csv or final_tours.parquet).
# ---------------------------------------------------------------------------
files:
  households:              household
  persons:                 person
  tours:                   tour
  trips:                   trip_linked
  joint_tour_participants: joint_tour_participants
  land_use:                land_use

# Optional shared fallback files for optional inputs that may be missing in some
# run folders. These must be explicit .csv or .parquet paths.
# fallback_files:
#   land_use: C:\Users\wesley.darling\Downloads\dataset_2026-05-21\unfiltered\land_use.csv

# ---------------------------------------------------------------------------
# Runs to compare
# Each entry specifies a run directory, a display label, and optional overrides.
#
# Weight columns (all optional — leave as null or omit to use default rules):
#   hh_weight_col:     explicit household weight column in final_households
#   person_weight_col: explicit person weight column in final_persons
#   trip_weight_col:   explicit trip weight column in final_trips
#                      (tour weight = average of its trips' weights when set)
#
# If none of the above are set and sample_rate is not in columns, all weights = 1.
# ---------------------------------------------------------------------------
runs:
  # - dir:              ~/Desktop/oregon/viz/metro/unfiltered
  #   label:            Unfiltered
  #   # skim_file:        null
  #   # hh_weight_col:    null
  #   # person_weight_col: null
  #   # trip_weight_col:  null
  # - dir:              ~/Desktop/oregon/viz/metro/filtered
  #   label:            Filtered
  #   # skim_file:        null
  #   # hh_weight_col:    null
  #   # person_weight_col: null
  #   # trip_weight_col:  null
  # - dir:              ~/Desktop/oregon/viz/metro/override
  #   label:            Override
  #   skim_file:        null
  #   hh_weight_col:    null
  #   person_weight_col: null
  #   trip_weight_col:  null
  - dir:              outputs/cropped
    label:            Cropped Metro Output
    # skim_file:        null
    # hh_weight_col:    null
    # person_weight_col: null
    # trip_weight_col:  null
    
# ---------------------------------------------------------------------------
# Skim file (global default — can be overridden per run below)
# ---------------------------------------------------------------------------
skim:
  file: resident/model_data/metro/data_cropped/autoSkims__MD.omx       # path relative to run directory, or absolute
  matrix: SOV_H_DIST__MD    # matrix name inside the OMX file

skimjoin:
  enabled: true
#   config_path: will_config_explicit_format.yaml

